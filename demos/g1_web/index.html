<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zealot demo — Unitree G1 on nexus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d2b2e;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #35c1cd;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      text-align: center;
      max-width: 80%;
    }
    .loading::after {
      content: '';
      display: block;
      width: 30px;
      height: 30px;
      margin: 10px auto;
      border: 3px solid #1c4a4f;
      border-top-color: #35c1cd;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .error {
      color: #ff6b6b;
    }
    .error::after {
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .vr-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      background: rgba(13, 43, 46, 0.8);
      color: #35c1cd;
      border: 1px solid #1c4a4f;
      border-radius: 6px;
      padding: 5px 10px;
      font: 12px system-ui, sans-serif;
      cursor: pointer;
    }
    .vr-btn:hover { background: #1c4a4f; }
    .vr-btn.on { color: #7ee787; border-color: #7ee787; }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading WebAssembly (GPU physics)...</div>
  <button class="vr-btn" id="vrBtn" title="Mirror your upper body from a VR headset via the retarget bridge (examples/vr_teleop)">🥽 VR</button>
  <script>
    // VR settings: prompt for the retarget-bridge WebSocket URL and reload
    // with ?vr=<url> — the wasm connects at startup and drives the held
    // arm joints from the stream (examples/vr_teleop/retarget_bridge.py).
    (() => {
      const q = new URLSearchParams(location.search);
      const btn = document.getElementById('vrBtn');
      const current = q.get('vr');
      if (current) {
        btn.classList.add('on');
        btn.textContent = '🥽 VR ✓';
      }
      btn.addEventListener('click', () => {
        const url = prompt(
          'Retarget bridge WebSocket URL (empty to disconnect):',
          current || 'ws://localhost:8765',
        );
        if (url === null) return;
        if (url.trim() === '') q.delete('vr');
        else q.set('vr', url.trim());
        location.search = q.toString();
      });
    })();
  </script>
  <script>
    // Mirror the first WebGPU/shader error into the tab TITLE. On Safari and
    // Firefox the devtools console can't be reached from automation, but the
    // title can (AppleScript / WebDriver) — this is how cross-browser GPU
    // failures get diagnosed at all. The wasm rewrites the title each second;
    // this setter appends the captured error to whatever it writes.
    (() => {
      let firstErr = '';
      const nat = Object.getOwnPropertyDescriptor(Document.prototype, 'title');
      Object.defineProperty(document, 'title', {
        configurable: true,
        get: () => nat.get.call(document),
        set: (v) => nat.set.call(document, firstErr ? v + ' || ' + firstErr : v),
      });
      for (const kind of ['error', 'warn']) {
        const orig = console[kind].bind(console);
        console[kind] = (...a) => {
          const s = a.map((x) => (typeof x === 'string' ? x : (x && x.message) || '')).join(' ');
          if (!firstErr && /invalid|validation|shader|pipeline|error|panic/i.test(s)) {
            firstErr = (kind + ': ' + s).replace(/\s+/g, ' ').slice(0, 150);
            // Publish straight away: if the wasm loop is what died, it will
            // never write the title again and the error would be invisible.
            nat.set.call(document, 'ERR| ' + firstErr);
          }
          orig(...a);
        };
      }
    })();
  </script>
  <script>
    // Render at a capped pixel ratio. winit sizes the drawing buffer from
    // window.devicePixelRatio, so a retina display renders 4x the pixels —
    // measured to matter a lot: the sim and the renderer share one GPU, and
    // at DPR 2 the WebGL pass eats the budget the physics needs. ?dpr=
    // overrides (100ths, e.g. 150 = 1.5).
    (() => {
      const q = new URLSearchParams(location.search);
      const dpr = Math.max(0.5, Math.min(3, (Number(q.get('dpr')) || 100) / 100));
      Object.defineProperty(window, 'devicePixelRatio', {get: () => dpr});
    })();
  </script>
  <script>
    // Embedded-maps wheel contract: a plain wheel always scrolls the
    // EMBEDDING page (forwarded both directions, so the story below the
    // fold stays reachable), while ctrl/cmd+wheel — which is also what a
    // trackpad pinch reports — falls through to the canvas and zooms the
    // camera BOTH ways. A transient overlay teaches the modifier whenever
    // a plain wheel hits. Standalone opens keep plain-wheel zoom.
    (() => {
      if (parent === window) return;
      const hint = document.createElement('div');
      hint.textContent = /Mac|iP/.test(navigator.platform || '')
        ? '⌘ + scroll to zoom' : 'Ctrl + scroll to zoom';
      hint.style.cssText = 'position:fixed;left:50%;bottom:18%;transform:translateX(-50%);'
        + 'background:#000b;color:#9fd8dc;font:13px system-ui;padding:8px 14px;'
        + 'border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9';
      document.body.appendChild(hint);
      let t;
      addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          // Keep the browser's own page-zoom off; the event still
          // propagates to the canvas, where winit zooms the camera.
          e.preventDefault();
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        parent.postMessage({zealotScroll: e.deltaY}, location.origin);
        hint.style.opacity = '1';
        clearTimeout(t);
        t = setTimeout(() => { hint.style.opacity = '0'; }, 1200);
      }, {capture: true, passive: false});
    })();
  </script>
  <script type="module">
    import init from './pkg/example.js';

    const loading = document.getElementById('loading');

    if (!navigator.gpu) {
      loading.className = 'loading error';
      loading.textContent = 'WebGPU is not available in this browser. '
        + 'The simulation runs its physics as WebGPU compute shaders and '
        + 'requires Chrome (or another Chromium-based browser). '
        + 'Safari and Firefox are not supported.';
    } else {
      init().then(() => {
        loading.style.display = 'none';
      }).catch(err => {
        console.error('WASM Error:', err);
        loading.className = 'loading error';
        loading.textContent = 'Error: ' + err.message;
      });
    }
  </script>
</body>
</html>
