<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zealot demo — Unitree G1 on nexus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d2b2e;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #35c1cd;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      text-align: center;
      max-width: 80%;
    }
    .loading::after {
      content: '';
      display: block;
      width: 30px;
      height: 30px;
      margin: 10px auto;
      border: 3px solid #1c4a4f;
      border-top-color: #35c1cd;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .error {
      color: #ff6b6b;
    }
    .error::after {
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading WebAssembly (GPU physics)...</div>
  <script type="module">
    import init from './pkg/example.js';

    const loading = document.getElementById('loading');

    if (!navigator.gpu) {
      loading.className = 'loading error';
      loading.textContent = 'WebGPU is not available in this browser. '
        + 'The simulation runs its physics as WebGPU compute shaders and '
        + 'requires Chrome (or another Chromium-based browser). '
        + 'Safari and Firefox are not supported.';
    } else {
      init().then(() => {
        loading.style.display = 'none';
      }).catch(err => {
        console.error('WASM Error:', err);
        loading.className = 'loading error';
        loading.textContent = 'Error: ' + err.message;
      });
    }
  </script>
</body>
</html>
