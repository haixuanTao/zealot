<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>three.js + rapier.js — Unitree G1 walking the v24 policy</title>
  <style>
    * { margin: 0; }
    body { background: #0d2b2e; color: #9fd8dc; font-family: ui-monospace, monospace; }
    /* Diagnostics live behind the (i) pill — the demo is the show, the
       numbers are for the curious (and the puppeteer harnesses, which read
       textContent and don't care about visibility). */
    #hud { position: fixed; top: 48px; left: 10px; background: #000c; padding: 10px 14px; font-size: 13px; white-space: pre; z-index: 2; border-radius: 6px; display: none; max-width: calc(100vw - 20px); }
    #hud.open { display: block; }
    #hudToggle { position: fixed; top: 10px; left: 10px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; border: none; background: #000a; color: #9fd8dc; font: 700 15px/1 system-ui; cursor: pointer; }
    /* Phones: the fixed-width columns overflow a 390px viewport — wrap and
       shrink; the numbers matter more than the alignment there. */
    @media (max-width: 700px) {
      #hud { font-size: 9.5px; padding: 6px 8px; right: 10px; white-space: pre-wrap; word-break: break-word; }
    }
    /* Boot indicator: the wasm download + compile takes seconds (tens on a
       phone) and the HUD that used to show it is now hidden by default — an
       explicit centered spinner keeps "loading" from looking like "broken". */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
            align-items: center; justify-content: center; color: #9fd8dc;
            font: 14px system-ui; background: #0d2b2e; z-index: 5; text-align: center; }
    #boot .spin { width: 30px; height: 30px; border: 3px solid #1c4a4f;
            border-top-color: #35c1cd; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    canvas { display: block; }
  </style>
</head>
<body>
  <button id="hudToggle" aria-label="Toggle diagnostics" onclick="document.getElementById('hud').classList.toggle('open')">ⓘ</button>
  <div id="boot"><div class="spin"></div><div>loading rapier.js + the policy…</div></div>
  <div id="hud">loading…</div>
  <script type="module">
    // The typical three.js physics stack — three.js WebGL + rapier.js (CPU
    // wasm) — running the REAL Unitree G1 12-DOF model AND the v24 walking
    // policy (same one as the wasm fleet demo; override with ?ckpt=),
    // ported 1:1 from examples/biped/sim2sim_g1_mujoco.py:
    // 45-dim obs frames (lag-2 action, cmd, q−default, finite-diff qd,
    // projected gravity, gait clock) × 5-frame history, Welford normalizer +
    // ELU MLP from the safetensors checkpoint, explicit torque PD @ 200 Hz
    // with the g1_29dof_agile leg gains, dt = 5 ms × 4 substeps per 20 ms
    // control step, 4 solver iterations. This is a SIM2SIM run: rapier's
    // solver differs from the nexus training env, so behaviour may differ.
    // ?n=10 sets robot count; ?auto=1 sweeps 1/10/25/50.
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/+esm';
    import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm';

    const hud = document.getElementById('hud');
    window.addEventListener('error', (e) => { const b = document.getElementById('boot'); if (b) b.textContent = 'failed to load: ' + e.message; hud.textContent = 'ERROR ' + e.message; console.log('[bench] ERROR ' + e.message); });
    await RAPIER.init();

    // ---- Model + visual meshes (same sources the zealot demo embeds).
    const model = await (await fetch('g1_model.json')).json();
    const visBuf = await (await fetch('g1_visuals_12dof.bin')).arrayBuffer();
    const visuals = new Map();
    {
      const dv = new DataView(visBuf);
      let o = 0;
      const n = dv.getUint32(o, true); o += 4;
      for (let i = 0; i < n; i++) {
        const l = dv.getUint8(o); o += 1;
        const name = new TextDecoder().decode(new Uint8Array(visBuf, o, l)); o += l;
        o += 16;
        const nv = dv.getUint32(o, true); o += 4;
        const nf = dv.getUint32(o, true); o += 4;
        const pos = new Float32Array(visBuf.slice(o, o + nv * 12)); o += nv * 12;
        const idx = new Uint32Array(visBuf.slice(o, o + nf * 12)); o += nf * 12;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setIndex(new THREE.BufferAttribute(idx, 1));
        geo.computeVertexNormals();
        visuals.set(name, geo);
      }
    }

    // ---- The walking checkpoint (safetensors: 8-byte header len + JSON
    // header + raw little-endian tensors).
    const policy = await (async () => {
      // What `?ckpt=` points at. A handle copied off a model page, the page
      // URL, a link to one file in it, or a direct URL elsewhere all mean
      // "run this policy" — same rules as the wasm demo's `parse_ckpt`.
      // A bare `owner/repo` asks the Hub what is in the repo and takes the
      // newest checkpoint by the numbers in the filenames.
      function parseCkpt(spec) {
        spec = decodeURIComponent(spec).trim().replace(/\/+$/, '');
        const hub = spec.match(/^(?:https?:\/\/(?:huggingface\.co|hf\.co)\/|hf\.co\/|hf:)(.+)$/);
        if (hub) {
          const p = hub[1].split('?')[0].split('/');
          if (p.length > 4 && (p[2] === 'blob' || p[2] === 'resolve'))
            return {url: `https://huggingface.co/${p[0]}/${p[1]}/resolve/${p[3]}/${p.slice(4).join('/')}`};
          if (p.length >= 2) return {repo: `${p[0]}/${p[1]}`};
        }
        if (/^https?:\/\//.test(spec)) return {url: spec};
        const p = spec.split('/');
        if (p.length >= 3) return {url: `https://huggingface.co/${p[0]}/${p[1]}/resolve/main/${p.slice(2).join('/')}`};
        if (p.length === 2) return {repo: spec};
        return {url: spec + '.safetensors'};
      }

      // Newest first by the numbers in the name, so g1_v24_iter32780 beats
      // g1_v21_iter4560 without demanding an exact naming convention.
      function newestFirst(files) {
        const nums = (s) => (s.match(/\d+/g) ?? []).map(Number);
        return files.sort((a, b) => {
          const [x, y] = [nums(a), nums(b)];
          for (let i = 0; i < Math.max(x.length, y.length); i++) {
            const d = (y[i] ?? -1) - (x[i] ?? -1);
            if (d) return d;
          }
          return b.localeCompare(a);
        });
      }

      async function ckptUrl(spec) {
        const ref = parseCkpt(spec);
        if (ref.url) return ref.url;
        const meta = await fetch(`https://huggingface.co/api/models/${ref.repo}`);
        if (!meta.ok) throw new Error(`${ref.repo}: Hub lookup failed (${meta.status})`);
        const files = newestFirst(
          ((await meta.json()).siblings ?? [])
            .map((s) => s.rfilename)
            .filter((f) => f.endsWith('.safetensors')),
        );
        if (!files.length) throw new Error(`${ref.repo}: no .safetensors in the repo`);
        return `https://huggingface.co/${ref.repo}/resolve/main/${files[0]}`;
      }
      // Default: the `g1_walk_latest` release pointer — republished on each
      // release (scripts/publish_policy.sh), so this page follows releases
      // without a redeploy.
      const ckpt =
        new URLSearchParams(location.search).get('ckpt') ||
        'haixuantao/zealot-g1-locomotion/g1_walk_latest.safetensors';
      const url = await ckptUrl(ckpt);
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('checkpoint fetch failed: ' + ckpt + ' (' + resp.status + ')');
      const buf = await resp.arrayBuffer();
      // Provenance for the HUD: name + size + cheap checksum of the weights.
      let sum = 0 >>> 0;
      const u32 = new Uint32Array(buf.slice(0, Math.floor(buf.byteLength / 4) * 4));
      for (let i = 0; i < u32.length; i += 997) sum = (sum ^ u32[i]) >>> 0;
      const shortName = url.split('?')[0].split('/').pop().replace(/\.safetensors$/, '');
      window.__ckptInfo = shortName + ' (' + (buf.byteLength / 1e6).toFixed(2) + ' MB, x' + sum.toString(16) + ')';
      const dv = new DataView(buf);
      const hlen = Number(dv.getBigUint64(0, true));
      const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, hlen)));
      const tensor = (name) => {
        const t = header[name];
        if (!t) return null;
        const [a, b] = t.data_offsets;
        return { shape: t.shape, data: new Float32Array(buf.slice(8 + hlen + a, 8 + hlen + b)) };
      };
      const W = [], B = [];
      for (let l = 0; ; l++) {
        const w = tensor(`actor.w_${l}`);
        if (!w) break;
        W.push(w);
        B.push(tensor(`actor.b_${l}`));
      }
      const mean = tensor('obs_norm.mean').data;
      const m2 = tensor('obs_norm.m2').data;
      const count = tensor('obs_norm.count').data[0];
      const std = mean.map((_, i) => Math.sqrt(Math.max(m2[i] / count, 1e-8)));
      const obsDim = W[0].shape[1];
      return {
        obsDim,
        act(obs) {
          let a = new Float64Array(obsDim);
          for (let i = 0; i < obsDim; i++) {
            a[i] = Math.min(5, Math.max(-5, (obs[i] - mean[i]) / std[i]));
          }
          for (let l = 0; l < W.length; l++) {
            const { shape: [out, inn], data: w } = W[l];
            const b = B[l].data;
            const z = new Float64Array(out);
            for (let r = 0; r < out; r++) {
              let s = b[r];
              const row = r * inn;
              for (let c = 0; c < inn; c++) s += w[row + c] * a[c];
              z[r] = l === W.length - 1 ? s : (s > 0 ? s : Math.expm1(s));
            }
            a = z;
          }
          return a;
        },
      };
    })();
    const HIST = 5;
    // v24 and later append the base angular velocity (gyro) to the frame;
    // v28 appends the 5-slot step cue, which stays all-zero here (the
    // trainer's "no step detected" pattern — this scene has no step oracle),
    // so the Float64Array's zero-init already assembles it.
    const FRAME = policy.obsDim / HIST;
    if (FRAME !== 45 && FRAME !== 48 && FRAME !== 53) throw new Error('obs dim ' + policy.obsDim);
    const HAS_GYRO = FRAME >= 48;

    // ---- Scene.
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d2b2e);
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
    camera.up.set(0, 0, 1);
    // Z-up orbit camera (drag: orbit, scroll: zoom) following the robots'
    // centroid — same feel as the zealot wasm demos. Tiny custom control
    // instead of the OrbitControls addon (which would pull a second copy of
    // three from the CDN).
    const cam = { target: new THREE.Vector3(0, 0, 0.5), yaw: -0.5, pitch: 0.35, dist: 8 };
    {
      let drag = null;
      let downAt = null;
      const el = renderer.domElement;
      el.style.touchAction = 'none';
      el.addEventListener('pointerdown', (e) => {
        drag = [e.clientX, e.clientY];
        downAt = [e.clientX, e.clientY];
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', (e) => {
        if (!drag) return;
        cam.yaw -= (e.clientX - drag[0]) * 0.005;
        cam.pitch = Math.min(1.45, Math.max(0.02, cam.pitch + (e.clientY - drag[1]) * 0.005));
        drag = [e.clientX, e.clientY];
      });
      el.addEventListener('pointerup', (e) => {
        // A press that never turned into a drag is a TAP: send the robot
        // to that spot on the ground.
        if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 6) {
          tapToWalk(e.clientX, e.clientY);
        }
        drag = null;
        downAt = null;
      });
      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        // Scrolling DOWN belongs to the embedding page (the story below the
        // fold); the wheel only zooms out from the framing we open at.
        if (e.deltaY > 0 && parent !== window) {
          parent.postMessage({zealotScroll: e.deltaY}, location.origin);
          return;
        }
        cam.dist = Math.min(60, Math.max(2, cam.dist * Math.exp(e.deltaY * 0.001)));
      }, { passive: false });
    }
    function applyCamera() {
      const cp = Math.cos(cam.pitch);
      camera.position.set(
        cam.target.x + cam.dist * cp * Math.cos(cam.yaw),
        cam.target.y + cam.dist * cp * Math.sin(cam.yaw),
        cam.target.z + cam.dist * Math.sin(cam.pitch),
      );
      camera.lookAt(cam.target);
    }
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(-2, 3, 5);
    scene.add(sun);
    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(200, 200, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x24565a, roughness: 0.95 }));
    ground.position.z = -0.05;
    scene.add(ground);
    const grid = new THREE.GridHelper(200, 200, 0x35787d, 0x2c6165);
    grid.rotation.x = Math.PI / 2;
    grid.position.z = 0.002;
    scene.add(grid);

    const matOf = (name) =>
      name === 'pelvis'
        ? new THREE.MeshStandardMaterial({ color: 0xcdd2d9, roughness: 0.5 })
        : name.includes('ankle_roll')
          ? new THREE.MeshStandardMaterial({ color: 0x40454c, roughness: 0.6 })
          : new THREE.MeshStandardMaterial({ color: 0x9aa2ab, roughness: 0.55 });
    const mats = new Map([...visuals.keys()].map((k) => [k, matOf(k)]));

    const ROBOT_GROUPS = (0x0002 << 16) | 0x0001;
    const GROUND_GROUPS = (0x0001 << 16) | 0xffff;
    const quatFromYTo = (d) => {
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
      return { w: q.w, x: q.x, y: q.y, z: q.z };
    };

    // ---- Home-pose FK: world pose of each body with the joints at their
    // home angles (training resets there; rest pose = straight legs).
    const jointIdx = [];      // model indices of the 12 policy joints, tree order
    model.forEach((b, i) => { if (b.joint) jointIdx.push(i); });
    const homePose = (() => {
      const R = model.map(() => new THREE.Quaternion());
      const T = model.map(() => new THREE.Vector3());
      model.forEach((b, i) => {
        if (b.parent < 0) {
          T[i].set(...b.pos);
          return;
        }
        const p = model[b.parent];
        const off = new THREE.Vector3(
          b.pos[0] - p.pos[0], b.pos[1] - p.pos[1], b.pos[2] - p.pos[2]);
        T[i].copy(T[b.parent]).add(off.clone().applyQuaternion(R[b.parent]));
        const axisW = new THREE.Vector3(...b.axis).applyQuaternion(R[b.parent]);
        const hinge = new THREE.Quaternion().setFromAxisAngle(axisW, b.home);
        R[i].copy(hinge.multiply(R[b.parent]));
      });
      return { R, T };
    })();

    const cmdParam = (new URLSearchParams(location.search).get('cmd') || '0.4,0,0').split(',').map(Number);
    const CMD = [cmdParam[0] || 0, cmdParam[1] || 0, cmdParam[2] || 0, 0];

    // ---- Live driving: each arrow / WASD press BUMPS the policy's velocity
    // command by a fixed step and the command latches, so you steer with taps
    // rather than holding a key. Space stops. A gamepad stick overrides while
    // deflected. Same mapping as the nexus demo.
    const STEP = 0.2;
    const RANGE = [[-0.6, 1.0], [-0.4, 0.4], [-0.6, 0.6]];   // vx, vy, yaw
    const clampAxis = (i, v) => Math.max(RANGE[i][0], Math.min(RANGE[i][1], v));
    const KEY_BUMP = {
      ArrowUp: [0, STEP], KeyW: [0, STEP],
      ArrowDown: [0, -STEP], KeyS: [0, -STEP],
      KeyA: [1, STEP], KeyD: [1, -STEP],
      ArrowLeft: [2, STEP], KeyQ: [2, STEP],
      ArrowRight: [2, -STEP], KeyE: [2, -STEP],
    };
    addEventListener('keydown', (e) => {
      if (e.repeat) return;                 // one press, one step
      if (e.code === 'Space') {
        cancelNav();
        CMD[0] = CMD[1] = CMD[2] = 0;
        e.preventDefault();
        return;
      }
      const bump = KEY_BUMP[e.code];
      if (bump) cancelNav();
      if (!bump) return;
      const [axis, delta] = bump;
      // Snap to 2 decimals: repeated float adds drift, and even 3*0.2 is
      // 0.6000000000000001, which the HUD would print verbatim.
      CMD[axis] = clampAxis(axis, Math.round((CMD[axis] + delta) * 100) / 100);
      e.preventDefault();                   // arrows would scroll the page
    });

    // A deflected stick overrides the latched command for as long as it's held.
    let padLatch = null;
    function applyDrive() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const pad of pads) {
        if (!pad) continue;
        const dead = (v) => (Math.abs(v) < 0.15 ? 0 : v);
        const lx = dead(pad.axes[0] || 0), ly = dead(pad.axes[1] || 0), rx = dead(pad.axes[2] || 0);
        if (lx || ly || rx) {
          cancelNav();
          if (!padLatch) padLatch = CMD.slice(0, 3);   // remember the keyed value
          CMD[0] = clampAxis(0, -ly > 0 ? -ly * RANGE[0][1] : -ly * -RANGE[0][0]);
          CMD[1] = clampAxis(1, -lx * RANGE[1][1]);
          CMD[2] = clampAxis(2, -rx * RANGE[2][1]);
          return;
        }
      }
      if (padLatch) {                        // stick released: back to keys
        [CMD[0], CMD[1], CMD[2]] = padLatch;
        padLatch = null;
      }
    }

    const ACTION_SCALE = 0.5;
    const DT = 0.02;
    // Gait clock. Which one depends on the checkpoint: the command-derived
    // clock below landed in the same training branch as the gyro observation,
    // so a 48-wide frame wants it and a 45-wide one (v21 and earlier) keeps
    // its original free-running 0.7 s period. Derived from the command:
    // a standing command (< 0.1 m/s) FREEZES the phase — standing is its own
    // observation state — and above that the cycle period lerps 0.8 s -> 0.55 s
    // with commanded speed. A free-running clock is a train/deploy mismatch:
    // the obs keeps asking for swings, so the robot marches in place at a stop.
    const GAIT_SLOW = 0.8, GAIT_FAST = 0.55;
    function gaitAdvance(ph, vx, vy, wz) {
      // 48-dim policies (v26+): FULL command magnitude incl. yaw rate.
      const sp = Math.hypot(vx, vy, wz || 0);
      if (sp < 0.1) return ph;
      const t = (Math.min(sp, 0.5) - 0.1) / 0.4;
      return (ph + DT / (GAIT_SLOW + (GAIT_FAST - GAIT_SLOW) * t)) % 1.0;
    }
    // Physics-accuracy knobs (?subdt= seconds, ?iters=, ?fiters=, ?cnf= Hz):
    // defaults match the original bench (5 ms substeps, 4 solver iters,
    // rapier's stock ~30 Hz soft contacts). cnf=240 mimics the training
    // env's contact stiffness (ERP tuned at 240 Hz / zeta=1).
    const knobs = new URLSearchParams(location.search);
    const SUB_DT = parseFloat(knobs.get('subdt') || '0.005');
    const N_SUB = Math.max(1, Math.round(0.02 / SUB_DT));
    const ITERS = parseInt(knobs.get('iters') || '4');
    const FITERS = parseInt(knobs.get('fiters') || '0');
    const CNF = parseFloat(knobs.get('cnf') || '0');
    const FALL_Z = 0.45;
    const TILT = Math.cos((70 * Math.PI) / 180);

    let world = null;
    let robots = [];
    let nodes = [];
    let terrainMesh = null;
    let falls = 0;

    function buildRobot(x0, y0, z0) {
      const bodies = [];
      const children = model.map(() => []);
      model.forEach((b, i) => { if (b.parent >= 0) children[b.parent].push(i); });
      const r = { bodies, joints: [], epT: 0, actHist: [new Float64Array(12), new Float64Array(12)], prevQ: new Float64Array(12), hist: null, gaitPh: 0, x0, y0, z0, navCmd: [0, 0, 0], cmd: null };
      model.forEach((b, i) => {
        // The body carries the REAL inertial properties from the MJCF
        // (mass, center of mass, principal inertia — colliders stay
        // massless): mass on collider shapes had put the fused pelvis's
        // 17.7 kg ~20 cm below its true CoM, giving the policy a different
        // robot to balance. Armature (0.02, the trained rotor inertia) is
        // added isotropically on jointed links — rapier has no joint-space
        // armature.
        const arm = b.parent >= 0 ? 0.02 : 0.0;
        const desc = RAPIER.RigidBodyDesc.dynamic()
          .setTranslation(x0 + homePose.T[i].x, y0 + homePose.T[i].y, z0 + homePose.T[i].z)
          .setRotation(homePose.R[i])
          .setAdditionalMassProperties(
            b.mass,
            { x: b.com[0], y: b.com[1], z: b.com[2] },
            { x: b.inertia[0] + arm, y: b.inertia[1] + arm, z: b.inertia[2] + arm },
            { w: b.inertiaQuat[0], x: b.inertiaQuat[1], y: b.inertiaQuat[2], z: b.inertiaQuat[3] });
        const rb = world.createRigidBody(desc);
        bodies.push(rb);
        const rest = new THREE.Quaternion(b.quat[1], b.quat[2], b.quat[3], b.quat[0]);
        const addCap = (aW, bW, rad) => {
          const mid = aW.clone().add(bW).multiplyScalar(0.5);
          const d = bW.clone().sub(aW);
          const cd = RAPIER.ColliderDesc.capsule(Math.max(d.length() / 2, 0.01), rad)
            .setTranslation(mid.x, mid.y, mid.z)
            .setRotation(quatFromYTo(d))
            .setDensity(0)
            .setCollisionGroups(ROBOT_GROUPS)
            .setFriction(1.0);
          world.createCollider(cd, rb);
        };
        if (b.capsules.length) {
          // The TRAINING env replaces the thin sole rails with ONE foot
          // capsule (radius = footprint half-width 0.03, long axis along the
          // foot, center shifted so the sole-bottom height is preserved) —
          // replicate it exactly (values from the env's derivation for this
          // model) so the contact geometry matches what v7 trained on.
          const aW = new THREE.Vector3(0.005, 0, 0.035 - 0.055).applyQuaternion(rest);
          const bW = new THREE.Vector3(0.005, 0, 0.035 + 0.055).applyQuaternion(rest);
          addCap(aW, bW, 0.03);
        } else {
          for (const c of children[i]) {
            const d = new THREE.Vector3(
              model[c].pos[0] - b.pos[0], model[c].pos[1] - b.pos[1], model[c].pos[2] - b.pos[2]);
            addCap(new THREE.Vector3(0, 0, 0), d, 0.045);
          }
          if (b.parent < 0) addCap(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0.35), 0.09);
        }
        const group = new THREE.Group();
        const geo = visuals.get(b.name);
        if (geo) {
          const m = new THREE.Mesh(geo, mats.get(b.name));
          m.quaternion.copy(rest);
          group.add(m);
        }
        scene.add(group);
        nodes.push(group);
        if (b.parent >= 0) {
          const p = model[b.parent];
          const jd = RAPIER.JointData.revolute(
            { x: b.pos[0] - p.pos[0], y: b.pos[1] - p.pos[1], z: b.pos[2] - p.pos[2] },
            { x: 0, y: 0, z: 0 },
            { x: b.axis[0], y: b.axis[1], z: b.axis[2] });
          const j = world.createImpulseJoint(jd, bodies[b.parent], rb, true);
          // Implicit force-based PD (rapier MotorModel.ForceBased) — the
          // closest analog of the training stack's implicitly-refreshed
          // force-based motors, and stable at these gains/dt.
          j.configureMotorModel(RAPIER.MotorModel.ForceBased);
          j.configureMotorPosition(b.home, b.kp, b.kd);
          r.joints.push(j);
        } else {
          r.joints.push(null);
        }
      });
      r.sync = bodies.map((rb, i) => [rb, nodes[nodes.length - model.length + i]]);
      robots.push(r);
    }

    function resetRobot(r) {
      model.forEach((b, i) => {
        r.bodies[i].setTranslation({ x: r.x0 + homePose.T[i].x, y: r.y0 + homePose.T[i].y, z: r.z0 + homePose.T[i].z }, true);
        r.bodies[i].setRotation(homePose.R[i], true);
        r.bodies[i].setLinvel({ x: 0, y: 0, z: 0 }, true);
        r.bodies[i].setAngvel({ x: 0, y: 0, z: 0 }, true);
      });
      r.epT = 0;
      r.gaitPh = 0;
      r.actHist = [new Float64Array(12), new Float64Array(12)];
      r.prevQ.fill(0);
      r.hist = null;
    }

    // Joint angle/velocity about the hinge (axis constant in the parent's
    // local frame; both frames share it through the constraint).
    const _qp = new THREE.Quaternion(), _qc = new THREE.Quaternion(), _rel = new THREE.Quaternion();
    function jointState(r, mi, out) {
      const b = model[mi];
      const rbP = r.bodies[b.parent], rbC = r.bodies[mi];
      const qp = rbP.rotation(), qc = rbC.rotation();
      _qp.set(qp.x, qp.y, qp.z, qp.w);
      _qc.set(qc.x, qc.y, qc.z, qc.w);
      _rel.copy(_qp).invert().multiply(_qc);
      const dot = _rel.x * b.axis[0] + _rel.y * b.axis[1] + _rel.z * b.axis[2];
      const q = 2 * Math.atan2(dot, _rel.w);
      const axW = new THREE.Vector3(...b.axis).applyQuaternion(_qp);
      const wp = rbP.angvel(), wc = rbC.angvel();
      const qd = (wc.x - wp.x) * axW.x + (wc.y - wp.y) * axW.y + (wc.z - wp.z) * axW.z;
      out.q = q; out.qd = qd; out.axW = axW;
      return out;
    }

    // ---- JS port of zealot-env's terrain generator (Boxes family — the
    // strip this demo spawns on), same knobs as the wasm terrain demo:
    // lvl = spawn difficulty patch, amp = amplitude multiplier, slope =
    // uphill grade (rise/m). Faithful to the Rust f32 code: 64-bit LCG via
    // BigInt (seed 0xC0FFEE spread exactly like TerrainStrip::generate),
    // Math.fround on the f32 chain feeding the 5 mm quantizer. Only a
    // window of columns around the spawn patch is meshed (rapier builds a
    // CPU BVH — the full 160 m strip would be ~1M triangles), but the RNG
    // stream always runs from patch 0 so heights match the wasm demo.
    function genBoxesTerrain(lvl, amp, slope) {
      const F = Math.fround;
      const MASK = (1n << 64n) - 1n;
      let st = ((0xC0FFEEn * 0x9E3779B97F4A7C15n) & MASK) ^ 0x7E44A11n;
      st |= 1n;
      const unit = () => {
        st = (st * 6364136223846793005n + 1442695040888963407n) & MASK;
        return F(Number(st >> 40n) / 16777216);
      };
      const range = (a, b) => F(a + F(F(b - a) * unit()));
      // Every constant must be the f32 value (0.075f32 !== 0.075f64 — the
      // ulp difference flips 5 mm quantization steps), and rounding is
      // half-AWAY-FROM-ZERO like Rust's f32::round.
      const VS = F(0.005);
      const rnd = (v) => (v < 0 ? -Math.round(-v) : Math.round(v));
      const Q = (h) => F(rnd(F(h / VS)) * VS);
      const HS = F(0.075), PATCH = 8, ROWS = 20, X0 = 8, HALF_W = 4;
      const nx = Math.round((PATCH * ROWS) / HS), ny = Math.round((2 * HALF_W) / HS);
      // Window node-columns [wa, wb]: a bit behind the spawn patch, ~28 m ahead.
      const wa = Math.max(0, Math.floor((PATCH * lvl - 4) / HS));
      const wb = Math.min(nx, Math.ceil((PATCH * (lvl + 1) + 28) / HS));
      const heights = new Float32Array((wb - wa + 1) * (ny + 1));
      const cell = F(0.15), G0 = F(0.04);
      const cnx = Math.floor(F(PATCH / cell)), cny = Math.floor(F((2 * HALF_W) / cell));
      for (let p = 0; p < ROWS; p++) {
        // ALWAYS draw the full RNG stream, even outside the window.
        const d = F(F(p + range(0, 1)) / ROWS);
        const g = F(F(G0 * d) * amp);
        const ch = new Float32Array(cnx * cny);
        for (let k = 0; k < cnx * cny; k++) ch[k] = Q(range(-g, g));
        // All divisions f32-rounded (F) — cell-boundary rows/columns flip
        // cells otherwise (f64 quotients straddle integers differently).
        const i0 = rnd(F(F(PATCH * p) / HS));
        const i1 = Math.min(rnd(F(F(PATCH * (p + 1)) / HS)), nx);
        for (let i = Math.max(i0, wa); i <= Math.min(i1, wb); i++) {
          const lx = F(F(i * HS) - PATCH * p);
          const ci = Math.min(Math.max(Math.trunc(F(lx / cell)), 0), cnx - 1);
          for (let j = 0; j <= ny; j++) {
            const cj = Math.min(Math.max(Math.trunc(F(F(j * HS) / cell)), 0), cny - 1);
            heights[(i - wa) * (ny + 1) + j] = ch[cj * cnx + ci];
          }
        }
      }
      if (slope !== 0) {
        for (let i = wa; i <= wb; i++) {
          const dz = F(F(slope * i) * HS);
          for (let j = 0; j <= ny; j++) heights[(i - wa) * (ny + 1) + j] = F(heights[(i - wa) * (ny + 1) + j] + dz);
        }
      }
      const node = (i, j) => heights[(i - wa) * (ny + 1) + j];
      // Piecewise-linear sampler matching the mesh triangulation below.
      const height = (x, y) => {
        const fx = (x - X0) / HS, fy = (y + HALF_W) / HS;
        if (fx < wa || fx >= wb || fy < 0 || fy >= ny) return 0;
        const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j;
        const h00 = node(i, j), h10 = node(i + 1, j), h01 = node(i, j + 1), h11 = node(i + 1, j + 1);
        return u >= v ? h00 + u * (h10 - h00) + v * (h11 - h10)
                      : h00 + v * (h01 - h00) + u * (h11 - h01);
      };
      // Max height over a small box (spawn clearance).
      const groundAt = (x, y, r = 0.2) => {
        let m = 0;
        for (let a = -2; a <= 2; a++)
          for (let b = -2; b <= 2; b++) m = Math.max(m, height(x + (a * r) / 2, y + (b * r) / 2));
        return m;
      };
      // Top-surface trimesh over the window (rapier doesn't need the closed
      // slab the nexus contact path requires).
      const nw = wb - wa + 1;
      const v = new Float32Array(nw * (ny + 1) * 3);
      for (let i = wa; i <= wb; i++)
        for (let j = 0; j <= ny; j++) {
          const o = ((i - wa) * (ny + 1) + j) * 3;
          v[o] = F(X0 + i * HS);
          v[o + 1] = F(-HALF_W + j * HS);
          v[o + 2] = node(i, j);
        }
      const idx = new Uint32Array((nw - 1) * ny * 6);
      let k = 0;
      const vid = (i, j) => (i - wa) * (ny + 1) + j;
      for (let i = wa; i < wb; i++)
        for (let j = 0; j < ny; j++) {
          idx[k++] = vid(i, j); idx[k++] = vid(i + 1, j); idx[k++] = vid(i + 1, j + 1);
          idx[k++] = vid(i, j); idx[k++] = vid(i + 1, j + 1); idx[k++] = vid(i, j + 1);
        }
      return { v, i: idx, height, groundAt, spawnX: X0 + PATCH * lvl + PATCH / 2 };
    }

    function setup(n) {
      for (const m of nodes) scene.remove(m);
      nodes = []; robots = [];
      if (world) world.free();
      world = new RAPIER.World({ x: 0, y: 0, z: -9.81 });
      world.timestep = SUB_DT;
      world.numSolverIterations = ITERS;
      if (FITERS > 0) world.integrationParameters.numAdditionalFrictionIterations = FITERS;
      if (CNF > 0) world.integrationParameters.contact_natural_frequency = CNF;
      world.createCollider(RAPIER.ColliderDesc.cuboid(100, 100, 0.5)
        .setTranslation(0, 0, -0.5).setCollisionGroups(GROUND_GROUPS).setFriction(1.0));
      if (TERRAIN) {
        // The SAME deterministic Boxes strip the zealot terrain demo
        // simulates (generated in-page by the JS port of the Rust generator).
        const tv = terrain.v;
        const ti = terrain.i;
        // FIX_INTERNAL_EDGES: without it capsule feet catch on edges between
        // coplanar triangles (classic trimesh artifact) and trip the robot.
        world.createCollider(RAPIER.ColliderDesc.trimesh(tv, ti, RAPIER.TriMeshFlags.FIX_INTERNAL_EDGES)
          .setCollisionGroups(GROUND_GROUPS).setFriction(1.0));
        const tg = new THREE.BufferGeometry();
        tg.setAttribute('position', new THREE.BufferAttribute(tv, 3));
        tg.setIndex(new THREE.BufferAttribute(ti, 1));
        tg.computeVertexNormals();
        const tm = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ color: 0x3a5f5c, roughness: 0.95 }));
        scene.add(tm);
        nodes.push(tm);
        terrainMesh = tm;
      }
      const cols = Math.min(n, 5);
      for (let i = 0; i < n; i++) {
        if (TERRAIN) {
          // On the spawn patch (x grows = harder), each robot lifted to drop
          // onto ITS local ground (slope/level can put it meters up).
          const px = terrain.spawnX + Math.floor(i / 5) * 3;
          const py = ((i % 5) - (cols - 1) / 2) * 1.5;
          buildRobot(px, py, terrain.groundAt(px, py) + 0.3);
        } else {
          buildRobot(Math.floor(i / 5) * -1.6, ((i % 5) - (cols - 1) / 2) * 1.6, 0);
        }
      }
      const rows = Math.ceil(n / 5);
      const cx = TERRAIN ? terrain.spawnX + ((rows - 1) * 3) / 2 : -(rows - 1) * 0.8;
      const cz = TERRAIN ? terrain.groundAt(cx, 0) : 0;
      // Seed the orbit camera from the classic framing (offset +5, -side, +2.3).
      cam.target.set(cx, 0, cz + 0.5);
      const ox = 5, oy = -(cols * 1.6 * 0.7 + 4), oz = 2.3;
      cam.dist = Math.hypot(ox, oy, oz);
      cam.yaw = Math.atan2(oy, ox);
      cam.pitch = Math.asin(oz / cam.dist);
      applyCamera();
    }

    // ---- Tap-to-walk: raycast the tap to a ground point and steer the
    // velocity command toward it. The policy only ever sees a velocity
    // command — this is a tiny P-controller on heading + distance, exactly
    // what a higher-level navigator would do on the real robot.
    let navTarget = null;
    // Wander: open with a random stroll target so the robot is visibly going
    // somewhere; every arrival draws the next one, until any user input
    // (tap, key, gamepad) takes over.
    let wander = true;
    let wanderSeeded = false;
    function pickStroll() {
      if (!robots.length) return;
      const t = robots[0].bodies[0].translation(); const px = t.x, py = t.y;
      const ang = Math.random() * Math.PI * 2;
      const dist = 2 + 1.5 * Math.random();
      const tx = px + dist * Math.cos(ang);
      const ty = Math.max(-3, Math.min(3, py + dist * Math.sin(ang)));
      const tz = TERRAIN && terrain ? terrain.groundAt(tx, ty) : 0;
      navTarget = { x: tx, y: ty };
      navMarker.position.set(tx, ty, tz + 0.03);
      navMarker.visible = true;
    }
    const navMarker = (() => {
      const g = new THREE.RingGeometry(0.16, 0.24, 32);
      const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x35c1cd, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
      m.visible = false;
      scene.add(m);
      return m;
    })();
    const navRay = new THREE.Raycaster();
    function tapToWalk(px, py) {
      navRay.setFromCamera(
        new THREE.Vector2((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1),
        camera,
      );
      // Terrain mesh when present, else the flat ground slab.
      const hits = navRay.intersectObjects(TERRAIN && terrainMesh ? [terrainMesh] : [ground]);
      if (!hits.length) return;
      const h = hits[0].point;
      // Clamp taps onto the strip; the flat apron past its edge is walkable
      // but off the demo's world.
      const tx = h.x;
      const ty = TERRAIN ? Math.max(-3.6, Math.min(3.6, h.y)) : h.y;
      const tz = TERRAIN && terrain ? terrain.groundAt(tx, ty) : h.z;
      wander = false;
      navSettle = false;
      navTarget = { x: tx, y: ty };
      navMarker.position.set(tx, ty, tz + 0.03);
      navMarker.visible = true;
    }
    function cancelNav() {
      wander = false;
      navTarget = null;
      navMarker.visible = false;
      navSettle = false;
      robots.forEach((r) => { r.cmd = null; });
    }
    // A tapped target is "reached" by the FIRST robot to get there; the
    // marker hides and everyone ramps down to a stand (settle phase).
    let navSettle = false;
    // Slew-limit the autopilot command, PER ROBOT: a stand-to-full step
    // input staggers the robot. Runs per 50 Hz control step (≈1 m/s²
    // linear, 2 rad/s² yaw). Robot 0's command mirrors into CMD for the HUD.
    function slewR(r, want) {
      const lim = [0.02, 0.02, 0.04];
      for (let i = 0; i < 3; i++) {
        const d = want[i] - r.navCmd[i];
        r.navCmd[i] += Math.max(-lim[i], Math.min(lim[i], d));
      }
      r.cmd = r.navCmd;
      if (r === robots[0]) { CMD[0] = r.navCmd[0]; CMD[1] = r.navCmd[1]; CMD[2] = r.navCmd[2]; }
    }
    function navDrive() {
      if (wander && !wanderSeeded && simTime > 0.3) {
        wanderSeeded = true;
        pickStroll();
      }
      if (!navTarget || !robots.length) return;
      const n = robots.length;
      // The WIN check runs against the MARKER itself — the tap ends when a
      // robot touches the disc, never because a ring slot 0.6 m away was
      // reached. The robot nearest the marker aims at it EXACTLY (so a
      // touch can actually happen); the rest fan onto a ring so they don't
      // shove each other on arrival.
      const dMark = robots.map((r) => {
        const t = r.bodies[0].translation();
        return Math.hypot(navTarget.x - t.x, navTarget.y - t.y);
      });
      const center = dMark.indexOf(Math.min(...dMark));
      const anyArrived = dMark.some((d) => d < 0.35);
      for (let i = 0; i < n; i++) {
        const r = robots[i];
        const ring = n > 1 && i !== center;
        const sr = ring ? 0.5 * Math.sqrt(n) : 0;
        const sa = ring ? (2 * Math.PI * (i > center ? i - 1 : i)) / (n - 1) : 0;
        const tx = navTarget.x + sr * Math.cos(sa);
        const ty = Math.max(-3.6, Math.min(3.6, navTarget.y + sr * Math.sin(sa)));
        const t = r.bodies[0].translation();
        const dx = tx - t.x, dy = ty - t.y;
        const dist = Math.hypot(dx, dy);
        if (navSettle || dist < 0.3) {
          slewR(r, [0, 0, 0]);
          continue;
        }
        const q = r.bodies[0].rotation();
        const f = new THREE.Vector3(1, 0, 0).applyQuaternion(new THREE.Quaternion(q.x, q.y, q.z, q.w));
        let err = Math.atan2(dy, dx) - Math.atan2(f.y, f.x);
        err = Math.atan2(Math.sin(err), Math.cos(err));
        // Turn toward the target; walk once roughly facing it, slowing on
        // approach so the stop is a settle rather than an overshoot.
        slewR(r, [
          Math.abs(err) > 1.1
            ? 0.1
            : Math.max(0, Math.cos(err)) * Math.min(0.5, 0.2 + 0.3 * Math.min(dist, 1)),
          0,
          Math.max(-1, Math.min(1, 1.6 * err)),
        ]);
      }
      if (wander) {
        // The FIRST robot to arrive draws the next stroll point.
        if (anyArrived) wanderSeeded = false;
      } else if (navSettle) {
        // Settle: everyone ramps to a stand, then the autopilot disengages.
        if (robots.every((r) => r.navCmd.every((v) => Math.abs(v) < 0.01))) {
          CMD[0] = CMD[1] = CMD[2] = 0;
          navSettle = false;
          cancelNav();
        }
      } else if (anyArrived) {
        // First robot there wins the tap: hide the marker, stand down.
        navSettle = true;
        navMarker.visible = false;
      }
    }

    const js = {};
    function controlStep() {
      applyDrive();
      navDrive();
      // Per robot: obs → policy → PD target; then 4 torque-PD substeps.
      const targets = robots.map((r) => {
        const o = new Float64Array(FRAME);
        const q = new Float64Array(12);
        jointIdx.forEach((mi, j) => { q[j] = jointState(r, mi, js).q; });
        for (let j = 0; j < 12; j++) {
          o[j] = r.epT >= 2 ? r.actHist[0][j] : 0;
          o[16 + j] = q[j] - model[jointIdx[j]].home;
          o[28 + j] = r.epT === 0 ? 0 : (q[j] - r.prevQ[j]) / DT;
        }
        const rot = r.bodies[0].rotation();
        // Autopilot steers each robot separately; manual input is global.
        const rc = r.cmd ?? CMD;
        o[12] = rc[0]; o[13] = rc[1]; o[14] = rc[2]; o[15] = CMD[3];
        // world-down in base frame (conjugate rotation of [0,0,-1])
        _qp.set(rot.x, rot.y, rot.z, rot.w).invert();
        const g = new THREE.Vector3(0, 0, -1).applyQuaternion(_qp);
        o[40] = g.x; o[41] = g.y; o[42] = g.z;
        const ph = r.gaitPh;
        o[43] = Math.sin(2 * Math.PI * ph); o[44] = Math.cos(2 * Math.PI * ph);
        r.gaitPh = HAS_GYRO ? gaitAdvance(ph, o[12], o[13], o[14]) : (ph + DT / 0.7) % 1.0;
        // Gyro: rapier reports angular velocity in WORLD frame, so rotate it
        // into the body frame with the same inverse quat used for gravity —
        // matching the trainer's quat_rotate_inv(orientation, ang_vel_world).
        if (HAS_GYRO) {
          const av = r.bodies[0].angvel();
          const wb = new THREE.Vector3(av.x, av.y, av.z).applyQuaternion(_qp);
          o[45] = wb.x; o[46] = wb.y; o[47] = wb.z;
        }

        if (r.hist === null) r.hist = Array.from({ length: HIST }, () => o.slice());
        else { r.hist.shift(); r.hist.push(o.slice()); }
        const stacked = new Float64Array(FRAME * HIST);
        r.hist.forEach((f, k) => stacked.set(f, k * FRAME));
        const action = policy.act(stacked);

        const tgt = new Float64Array(12);
        for (let j = 0; j < 12; j++) {
          const b = model[jointIdx[j]];
          tgt[j] = Math.min(b.range[1], Math.max(b.range[0], b.home + ACTION_SCALE * action[j]));
        }
        r.prevQ.set(q);
        r.actHist = [r.actHist[1], Float64Array.from(action)];
        r.epT += 1;
        return tgt;
      });

      robots.forEach((r, ri) => {
        jointIdx.forEach((mi, j) => {
          const b = model[mi];
          r.joints[mi].configureMotorPosition(targets[ri][j], b.kp, b.kd);
        });
      });
      for (let s = 0; s < N_SUB; s++) world.step();

      // Mean planar speed accumulation (per control step, all robots).
      for (const r of robots) {
        const t = r.bodies[0].translation();
        if (r.lastXY) {
          window.__spdAcc = (window.__spdAcc || 0) +
            Math.hypot(t.x - r.lastXY[0], t.y - r.lastXY[1]) / DT;
          window.__spdN = (window.__spdN || 0) + 1;
        }
        r.lastXY = [t.x, t.y];
      }

      // Fall / timeout per robot — height RELATIVE to the local ground
      // (level/slope can put the terrain surface well above z = 0).
      for (const r of robots) {
        const t = r.bodies[0].translation();
        const rot = r.bodies[0].rotation();
        const ground = terrain ? terrain.height(t.x, t.y) : 0;
        const upz = 1 - 2 * (rot.x * rot.x + rot.y * rot.y);
        if (t.z - ground < FALL_Z || upz < TILT) { // fall only — no episode timeout in a demo
          if (t.z - ground < FALL_Z || upz < TILT) falls += 1;
          resetRobot(r);
          r.lastXY = null;
        }
      }
    }

    const params = new URLSearchParams(location.search);
    const AUTO = params.get('auto') === '1';
    // ?terrain=1 → easy end of the strip (levels 0-4, spawn x=10);
    // ?terrain=2 → HARDEST end (levels ~17-19, spawn x=164, walking off the
    // 168 m strip end like the training env's terminal patch).
    // Terrain knobs (same as the wasm terrain demo): ?lvl=0..19 spawn
    // difficulty patch, ?amp=% roughness, ?slope=° uphill grade — terrain is
    // GENERATED here (JS port of the Rust generator, same seed). Legacy
    // ?terrain=1/2 maps to lvl 2/19.
    const TMODE = parseInt(params.get('terrain') || '0');
    const TLVL = params.has('lvl')
      ? Math.min(Math.max(parseInt(params.get('lvl')) || 0, 0), 19)
      : TMODE === 2 ? 19 : TMODE === 1 ? 2 : -1;
    const TERRAIN = TLVL >= 0;
    const TAMP = Math.min(Math.max(parseInt(params.get('amp') || '100') || 0, 0), 300) / 100;
    const TSLOPE_DEG = Math.min(Math.max(parseInt(params.get('slope') || '0') || 0, 0), 20);
    const terrain = TERRAIN
      ? genBoxesTerrain(TLVL, TAMP, Math.tan((TSLOPE_DEG * Math.PI) / 180))
      : null;
    const sweep = [1, 10, 25, 50];
    let n = AUTO ? sweep[0] : parseInt(params.get('n') || '10');
    setup(n);

    let simTime = 0;
    let t0 = performance.now();
    let frames = 0, steps = 0, physMs = 0, winT0 = performance.now();
    const results = [];
    let sweepIdx = 0, sweepWin = 0;

    let bootGone = false;
    function dropBoot() {
      if (!bootGone) {
        bootGone = true;
        document.getElementById('boot')?.remove();
      }
    }
    function frame() {
      dropBoot();
      const wall = (performance.now() - t0) / 1000;
      let stepsThisFrame = 0;
      while (simTime < wall && stepsThisFrame < 4) {
        const p0 = performance.now();
        controlStep();
        physMs += performance.now() - p0;
        steps += 1;
        simTime += DT;
        stepsThisFrame += 1;
      }
      if (simTime < wall - 0.25) simTime = wall;

      for (const r of robots) {
        for (const [rb, m] of r.sync) {
          const t = rb.translation(), q = rb.rotation();
          m.position.set(t.x, t.y, t.z);
          m.quaternion.set(q.x, q.y, q.z, q.w);
        }
      }
      // Camera follows the pelvis centroid smoothly (user drag/zoom compose
      // on top via the orbit state).
      if (robots.length) {
        let mx = 0, my = 0, mz = 0;
        for (const r of robots) {
          const t = r.bodies[0].translation();
          mx += t.x; my += t.y; mz += t.z;
        }
        const k = 0.05;
        cam.target.x += (mx / robots.length - cam.target.x) * k;
        cam.target.y += (my / robots.length - cam.target.y) * k;
        cam.target.z += (mz / robots.length - 0.2 - cam.target.z) * k;
      }
      applyCamera();
      renderer.render(scene, camera);

      frames += 1;
      const win = (performance.now() - winT0) / 1000;
      if (win >= 1.0) {
        const fps = frames / win;
        const ms = steps ? physMs / steps : 0;
        const rt = Math.min(steps / (win / DT), 1);
        hud.textContent =
          `three.js + rapier.js — REAL G1   policy: ${window.__ckptInfo}   robots: ${n}\n` +
          (TERRAIN ? `terrain: level ${TLVL}/19   roughness ${Math.round(TAMP * 100)}%   slope ${TSLOPE_DEG}°\n` : '') +
          `render: ${fps.toFixed(0)} fps   physics+policy: ${ms.toFixed(2)} ms/ctrl-step\n` +
          `sim speed: ${(rt * 100).toFixed(0)}% of real time   falls: ${falls}\n` +
          `mean speed: ${(window.__spdN ? window.__spdAcc / window.__spdN : 0).toFixed(2)} m/s (cmd ${CMD[0].toFixed(2)})\n` +
          `tap ground: walk there   drag: orbit camera   scroll: zoom   keys: ↑↓ ±0.2, ←→ turn, space stops`;
        window.__spdAcc = 0; window.__spdN = 0;
        if (AUTO) {
          sweepWin += 1;
          if (sweepWin >= 5) {
            results.push({ n, fps: +fps.toFixed(1), physMs: +ms.toFixed(2), rt: +(rt * 100).toFixed(0), falls });
            console.log(`[bench] n=${n} fps=${fps.toFixed(1)} phys+pol=${ms.toFixed(2)}ms rt=${(rt * 100).toFixed(0)}% falls=${falls}`);
            sweepIdx += 1;
            if (sweepIdx >= sweep.length) {
              console.log('[bench] DONE ' + JSON.stringify(results));
              hud.textContent += '\nDONE';
              return;
            }
            n = sweep[sweepIdx];
            falls = 0;
            setup(n);
            simTime = 0; t0 = performance.now();
            sweepWin = 0;
          }
        }
        frames = 0; steps = 0; physMs = 0; winT0 = performance.now();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
