[workspace]
resolver = "2"
members = ["zealot-env", "zealot-rl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zealot-env = { path = "zealot-env" }
zealot-rl = { path = "zealot-rl" }

# The workspace root is also a package: it hosts the runnable examples that
# exercise the GPU learning stack (vortx + khal). The examples don't depend on
# zealot-rl yet — they validate the vortx forward/backward/Adam primitives that
# zealot-rl's policy + PPO will be built on.
[package]
name = "zealot"
version.workspace = true
edition.workspace = true
license.workspace = true

# Everything that touches the GPU is gated behind a feature (all off by default)
# because the dimforge stack — vortx and nexus3d — compiles rust-gpu shaders via
# cargo-gpu, which needs a special toolchain. Keeping it optional lets
# `cargo check --workspace` stay green for anyone without that toolchain.
#
#   gpu      — vortx (dimforge's GPU tensor lib): hand-rolled MLP forward/backward
#              + Adam (vortx has no autograd). Used by the tensor examples.
#   pendulum — nexus3d GPU rigid-body physics + rapier3d (CPU-side scene build).
#              Used by the pendulum examples under examples/pendulum/.
#
# vortx/khal/rapier3d are taken from crates.io but redirected to local dimforge
# forks by [patch.crates-io] below — the same forks nexus3d is built against.
[features]
default = []
gpu = ["dep:vortx", "dep:khal"]
pendulum = ["dep:nexus3d", "dep:rapier3d", "dep:pollster", "dep:khal"]
# biped — the LeRobot bipedal on nexus GPU physics + the URDF loader
# (rapier3d-urdf, stl meshes → cheap Obb colliders). Used by the GPU biped examples.
biped = ["pendulum", "dep:rapier3d-urdf", "dep:zealot-env"]
# cpu — the LeRobot bipedal on rapier's CPU multibody (mature floating-base +
# contacts). No nexus / cargo-gpu needed, so it builds and runs on any machine.
# Includes the MuJoCo-XML model loader (roxmltree) — the curated standing model.
cpu = ["dep:rapier3d", "dep:rapier3d-urdf", "dep:zealot-env", "dep:zealot-rl", "dep:roxmltree", "dep:rayon"]
# biped_gpu — biped on nexus GPU physics, MJCF model. Pulls zealot-rl so the
# nexus trainer can build (the smoke example doesn't need it, but it's a
# negligible link-time addition).
biped_gpu = ["pendulum", "dep:roxmltree", "dep:zealot-env", "dep:zealot-rl", "dep:rayon"]
# cuda_backend — additively enables the native-CUDA (cuda-oxide) khal backend on
# the vortx + nexus3d stack, alongside WebGPU. Selected at runtime via BIPED_CUDA=1.
# Used for the all-native end-to-end benchmark (iter_e2e_bench). The cubins are
# embedded at build time via CUDA_OXIDE_SHADERS_PTX_{NEXUS_RBD_SHADERS3D,VORTX_SHADERS}.
cuda_backend = ["gpu", "biped_gpu", "khal/cuda", "nexus3d/cuda", "vortx/cuda"]
# cutile — cuTile Rust (NVlabs cutile-rs, sibling checkout pinned at tag
# v0.2.0): tf32 tensor-core GEMMs for the PPO update, opt-in at runtime with
# BIPED_CUTILE_GEMM=1. BUILDING with this feature needs CUDA_TOOLKIT_PATH
# pointing at CUDA 13.2+ headers (~/cuda-13-shim on this box); the RUNTIME JIT
# needs tileiras + ptxas 13.3 first on PATH (~/cuda-13.3-tile/bin). See
# examples/biped/cutile_gemm.rs for the interop details and measured numbers.
cutile = ["cuda_backend", "dep:cutile", "dep:cutile-compiler", "dep:cuda-core", "dep:cuda-async"]

[dependencies]
cutile = { path = "../cutile-rs/cutile", optional = true }
cutile-compiler = { path = "../cutile-rs/cutile-compiler", optional = true }
cuda-core = { path = "../cutile-rs/cuda-core", optional = true }
cuda-async = { path = "../cutile-rs/cuda-async", optional = true }
vortx = { version = "0.3", optional = true }
khal = { version = "0.2", features = ["derive", "webgpu"], optional = true }
nexus3d = { path = "../nexus-unified/crates/nexus3d", features = ["rbd"], optional = true }
rapier3d = { version = "0.34", optional = true }
rapier3d-urdf = { version = "0.34", features = ["stl"], optional = true }
roxmltree = { version = "0.20", optional = true }
rayon = { version = "1", optional = true }
pollster = { version = "0.4", optional = true }
zealot-env = { workspace = true, optional = true }
zealot-rl = { workspace = true, optional = true }

[dev-dependencies]
nalgebra = "0.35"
wgpu = "29"
async-std = { version = "1", features = ["attributes"] }
anyhow = "1"

# Fully GPU-resident trainer: GPU policy forward + GPU PPO update (vortx).
[[example]]
name = "biped_train_gpu"
path = "examples/biped/biped_train_gpu.rs"
required-features = ["gpu", "biped_gpu"]

[[example]]
name = "zero_action_probe"
path = "examples/biped/zero_action_probe.rs"
required-features = ["gpu", "biped_gpu"]

# Train briefly on nexus then record a deterministic env-0 rollout to JSON.
# Render with `python3 examples/biped/render_biped.py <out.json> <out.mp4>`.

# Train briefly on nexus then record a deterministic env-0 rollout to JSON.
# Render with `python3 examples/biped/render_biped.py <out.json> <out.mp4>`.
[[example]]
name = "biped_render_nexus"
path = "examples/biped/biped_render_nexus.rs"
required-features = ["biped_gpu", "gpu"]

# Drive a trained policy with a constant velocity command and report where the
# robot goes (per-second pose, commanded-vs-achieved summary, ASCII path map).

# Drive a trained policy with a constant velocity command and report where the
# robot goes (per-second pose, commanded-vs-achieved summary, ASCII path map).
[[example]]
name = "biped_drive"
path = "examples/biped/biped_drive.rs"
required-features = ["biped_gpu"]

# Numerical parity: GPU PPO output-grad kernels (vortx) vs scalar-CPU reference.

[patch.crates-io]
# naga 29 MSL backend miscompiles rust-gpu `while` loops on Metal: the
# hoisted continuing block re-evaluates the `break_if` condition after the
# loop phis were already advanced, exiting one body-execution early (drops
# final accumulator stores → the multibody contact/joint solve produced zero
# impulses, so the biped free-fell then launched on macOS). ../naga-fixed
# (vendored naga 29.0.4) snapshots the condition value at its Emit point
# instead. See docs/metal-contact-bug-proposal.md.
naga = { path = "../naga-fixed" }
khal = { path = "../khal-unified/crates/khal" }
khal-derive = { path = "../khal-unified/crates/khal-derive" }
khal-std = { path = "../khal-unified/crates/khal-std" }
khal-builder = { path = "../khal-unified/crates/khal-builder" }
vortx = { path = "../vortx-unified" }
vortx-shaders = { path = "../vortx-unified/vortx-shaders" }
parry3d = { path = "../parry/crates/parry3d" }

[[example]]
name = "passive_stand"
path = "examples/biped/passive_stand.rs"
required-features = ["gpu", "biped_gpu"]

